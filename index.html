<title>배드민턴 대진표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: control panel (left) + rounds column (right), stacking on phones; each round is a strip of court cards */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --fg:#17231f; --muted:#5e6f68; --line:#d6e0db;
  --court:#1d6b57; --court-ink:#ffffff; --shuttle:#e9b949; --soft:#e5efea; --danger:#b5443a;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#16211e; --fg:#e4ece8; --muted:#93a59d; --line:#2a3a35;
  --court:#2f8f75; --court-ink:#ffffff; --shuttle:#e9b949; --soft:#1d2b27; --danger:#e07a6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#16211e; --fg:#e4ece8; --muted:#93a59d; --line:#2a3a35;
  --court:#2f8f75; --court-ink:#ffffff; --shuttle:#e9b949; --soft:#1d2b27; --danger:#e07a6f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
header.top{max-width:1180px;margin:0 auto 20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:34px;margin:0;letter-spacing:.5px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:18px}
.label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.label .spacer{flex:1}
.row{display:flex;gap:8px}
input[type=text],input[type=number]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--shuttle);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;white-space:nowrap}
button:hover{border-color:var(--court)}
button.primary{background:var(--court);color:var(--court-ink);border-color:var(--court);font-weight:600;padding:11px 14px}
button.primary:hover{filter:brightness(1.08)}
button.link{border:none;background:none;color:var(--muted);padding:2px 4px;font-size:13px;text-decoration:underline;font-weight:400;letter-spacing:0}
button.link.on{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--court);color:var(--court-ink);border-radius:999px;padding:3px 4px 3px 11px;font-size:14px}
.chip button{border:none;background:none;padding:0 6px;color:inherit;opacity:.75;font-size:16px;line-height:1}
.chip button:hover{opacity:1}
.none{font-size:13px;color:var(--muted)}
.members{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow-y:auto;padding:2px}
.mchip{border-radius:999px;padding:4px 12px;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.mchip[aria-pressed=true]{background:var(--soft);border-color:var(--court);color:var(--court);font-weight:600}
.mchip[aria-pressed=true]::before{content:"✓ "}
.members.editing .mchip{border-style:dashed;color:var(--danger);border-color:var(--danger);background:var(--surface);font-weight:400}
.members.editing .mchip::before{content:"× "}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:0}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:none;border-radius:0}
.seg button[aria-pressed=true]{background:var(--court);color:var(--court-ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--muted);margin:0}
.msg{font-size:13px;color:var(--danger);margin:0}
.actions{display:flex;flex-direction:column;gap:8px}
main{display:flex;flex-direction:column;gap:20px;min-width:0}
.empty{border:1px dashed var(--line);border-radius:10px;padding:32px;text-align:center;color:var(--muted)}
.round{display:flex;flex-direction:column;gap:10px}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rnum{font-family:var(--f-display);font-size:22px}
.done-toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.done-toggle input{accent-color:var(--court);width:16px;height:16px}
.round.done .courts{opacity:.55}
.round.done .rnum::after{content:" 완료";font-family:var(--f-body);font-size:13px;color:var(--court);font-weight:600}
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.court{background:var(--court);color:var(--court-ink);border-radius:8px;padding:12px 14px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-width:0}
.court::before{content:"";position:absolute;inset:6px;border:1.5px solid rgba(255,255,255,.28);border-radius:4px;pointer-events:none}
.court::after{content:"";position:absolute;left:6px;right:6px;top:50%;border-top:1.5px solid rgba(255,255,255,.28);pointer-events:none}
.ctag{font-size:11px;letter-spacing:.1em;font-weight:600;opacity:.8;position:relative}
.team{position:relative;font-weight:600;font-size:16px;overflow-wrap:anywhere}
.vs{position:relative;align-self:flex-start;background:var(--shuttle);color:#2a2105;font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:999px;margin:6px 0;z-index:1}
.rest{font-size:13px;color:var(--muted)}
.rest b{font-weight:500;color:var(--fg)}
.stats{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto}
.stats h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.gone td{color:var(--muted);text-decoration:line-through}
.bar{display:inline-block;height:8px;background:var(--court);border-radius:2px;vertical-align:middle;margin-left:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <h1>배드민턴 대진표</h1>
  <span class="sub">회원 목록에서 오늘 참석자를 눌러 고르면, 경기 수가 고르게 돌아가도록 짝과 상대를 섞어 줍니다.</span>
</header>

<div class="wrap">
  <aside class="panel">
    <div>
      <div class="label">오늘 참석자 <span class="count" id="pcount"></span><span class="spacer"></span><button class="link" id="clearPlayers">모두 빼기</button></div>
      <div class="chips" id="chips"></div>
    </div>

    <div>
      <div class="label">회원 목록 <span class="count" id="mcount"></span><span class="spacer"></span>
        <button class="link" id="selAll">전체 선택</button>
        <button class="link" id="editBtn">회원 삭제</button></div>
      <div class="row" style="margin-bottom:8px">
        <input type="text" id="nameIn" placeholder="이름 검색 또는 새 회원 입력" autocomplete="off">
        <button id="addBtn">추가</button>
      </div>
      <div class="members" id="members"></div>
      <p class="hint" id="memberHint" style="margin-top:6px">이름을 누르면 참석자로 들어가고, 다시 누르면 빠집니다. 목록에 없는 사람은 위에 입력하고 추가하세요.</p>
    </div>

    <div>
      <div class="label">경기 방식</div>
      <div class="seg" role="group" aria-label="경기 방식">
        <button id="mDouble" aria-pressed="true">복식</button>
        <button id="mSingle" aria-pressed="false">단식</button>
      </div>
    </div>

    <div class="grid2">
      <div><label class="label" for="courtsIn">코트 수</label><input type="number" id="courtsIn" min="1" max="20" value="2"></div>
      <div><label class="label" for="roundsIn">만들 라운드 수</label><input type="number" id="roundsIn" min="1" max="50" value="6"></div>
    </div>

    <div class="actions">
      <button class="primary" id="genBtn">대진표 만들기</button>
      <p class="hint">참석자를 추가하거나 빼고 다시 누르면, <b>완료</b> 표시한 라운드는 그대로 두고 남은 경기만 새로 짭니다. 앞서 뛴 경기 수와 짝 기록도 반영돼요.</p>
      <p class="msg" id="msg" hidden></p>
      <button class="link" id="resetBtn" style="align-self:flex-start">대진표 전체 초기화</button>
    </div>
  </aside>

  <main>
    <div id="rounds"></div>
    <section class="stats" id="statsBox" hidden>
      <h2>참석자별 경기 수</h2>
      <table><thead><tr><th>이름</th><th>경기</th><th>휴식</th></tr></thead><tbody id="statBody"></tbody></table>
    </section>
  </main>
</div>

<script>
/* 기본 회원 목록: 처음 여는 사람에게 보이는 명단 */
const DEFAULT_MEMBERS=['이주무','박민수','박필규','이윤주','정태화','장선영','김종길','이준호','권은실','김상근','신우예','김선아','안선희','최광일'];

const KEY='badminton-bracket-v1';
let S={members:null,removedDefaults:[],players:[],mode:'doubles',courts:2,rounds:6,schedule:[]};
try{
  const s=JSON.parse(localStorage.getItem(KEY)||'null');
  if(s){
    if(s.example){s.players=[];s.schedule=[];}           // 이전 버전의 예시 명단은 버림
    delete s.example;
    S=Object.assign(S,s);
  }
}catch(e){}
const uniq=a=>[...new Set(a)];
if(!Array.isArray(S.members))S.members=uniq([...DEFAULT_MEMBERS,...S.players]);
// 기본 명단에 새로 들어간 이름도 반영 (직접 삭제한 이름은 제외)
S.members=uniq([...S.members,...DEFAULT_MEMBERS.filter(n=>!S.removedDefaults.includes(n))]);
S.players=S.players.filter(p=>S.members.includes(p));
let editing=false;

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=id=>document.getElementById(id);
const sortKo=a=>a.slice().sort((x,y)=>x.localeCompare(y,'ko'));

function addNames(txt){
  const names=txt.split(/[,\n，、]+/).map(s=>s.trim()).filter(Boolean);
  names.forEach(n=>{
    if(!S.members.includes(n))S.members.push(n);
    if(!S.players.includes(n))S.players.push(n);
  });
  showMsg('');save();render();
}
function toggleMember(n){
  if(S.players.includes(n))S.players=S.players.filter(p=>p!==n);else S.players.push(n);
  save();render();
}
function removePlayer(n){S.players=S.players.filter(p=>p!==n);save();render();}
function deleteMember(n){
  S.members=S.members.filter(p=>p!==n);
  S.players=S.players.filter(p=>p!==n);
  if(DEFAULT_MEMBERS.includes(n)&&!S.removedDefaults.includes(n))S.removedDefaults.push(n);
  save();render();
}
function showMsg(t){$('msg').textContent=t;$('msg').hidden=!t;}

/* ---------- 대진 생성 ---------- */
const pk=(a,b)=>a<b?a+'|'+b:b+'|'+a;
function buildHistory(rounds){
  const H={games:{},rest:{},partner:{},opp:{},lastRest:new Set()};
  rounds.forEach((r,i)=>{
    r.matches.forEach(m=>{
      [...m.a,...m.b].forEach(p=>H.games[p]=(H.games[p]||0)+1);
      if(m.a.length===2){H.partner[pk(m.a[0],m.a[1])]=(H.partner[pk(m.a[0],m.a[1])]||0)+1;H.partner[pk(m.b[0],m.b[1])]=(H.partner[pk(m.b[0],m.b[1])]||0)+1;}
      m.a.forEach(x=>m.b.forEach(y=>H.opp[pk(x,y)]=(H.opp[pk(x,y)]||0)+1));
    });
    r.rest.forEach(p=>H.rest[p]=(H.rest[p]||0)+1);
    if(i===rounds.length-1)H.lastRest=new Set(r.rest);
  });
  return H;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function bestDoubles(g,H){
  const opts=[[[g[0],g[1]],[g[2],g[3]]],[[g[0],g[2]],[g[1],g[3]]],[[g[0],g[3]],[g[1],g[2]]]];
  let best=null,bc=1e9;
  opts.forEach(([a,b])=>{
    const pa=H.partner[pk(a[0],a[1])]||0,pb=H.partner[pk(b[0],b[1])]||0;
    let c=(pa*pa+pb*pb)*10;
    a.forEach(x=>b.forEach(y=>{const o=H.opp[pk(x,y)]||0;c+=o*o*2;}));
    if(c<bc){bc=c;best={a,b};}
  });
  return {...best,cost:bc};
}
function makeRound(players,H,mode,courts){
  const per=mode==='doubles'?4:2;
  const nC=Math.min(courts,Math.floor(players.length/per));
  const need=nC*per;
  const order=players.map(p=>({p,g:H.games[p]||0,lr:H.lastRest.has(p)?0:1,r:Math.random()}))
    .sort((x,y)=>x.g-y.g||x.lr-y.lr||x.r-y.r).map(o=>o.p);
  const sel=order.slice(0,need),rest=order.slice(need);
  let best=null,bc=1e9;
  for(let t=0;t<400;t++){
    const s=shuffle(sel.slice());let ms=[],c=0;
    for(let k=0;k<nC;k++){
      const g=s.slice(k*per,(k+1)*per);
      if(per===4){const d=bestDoubles(g,H);c+=d.cost;ms.push({a:d.a,b:d.b});}
      else{const o=H.opp[pk(g[0],g[1])]||0;c+=o*o*10;ms.push({a:[g[0]],b:[g[1]]});}
    }
    if(c<bc){bc=c;best=ms;if(c===0)break;}
  }
  best.forEach((m,i)=>m.court=i+1);
  return {matches:best,rest,done:false};
}
function generate(){
  showMsg('');
  S.courts=Math.max(1,parseInt($('courtsIn').value)||1);
  S.rounds=Math.max(1,parseInt($('roundsIn').value)||1);
  const per=S.mode==='doubles'?4:2;
  if(S.players.length<per){showMsg(`${S.mode==='doubles'?'복식':'단식'}은 최소 ${per}명이 필요해요. 회원 목록에서 참석자를 더 골라 주세요.`);return;}
  const out=S.schedule.filter(r=>r.done);
  for(let i=0;i<S.rounds;i++){const H=buildHistory(out);out.push(makeRound(S.players,H,S.mode,S.courts));}
  S.schedule=out;save();render();
  const possible=Math.floor(S.players.length/per);
  if(S.courts>possible)showMsg(`참석자 ${S.players.length}명으로는 코트 ${possible}면만 동시에 쓸 수 있어요.`);
}

/* ---------- 화면 ---------- */
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function renderMembers(){
  const q=$('nameIn').value.trim();
  const list=sortKo(S.members).filter(n=>!q||n.includes(q));
  const M=$('members');
  M.classList.toggle('editing',editing);
  M.innerHTML=list.length?list.map(n=>`<button class="mchip" aria-pressed="${S.players.includes(n)}" data-m="${esc(n)}">${esc(n)}</button>`).join('')
    :`<span class="none">${q?`'${esc(q)}' 회원이 없어요. <b>추가</b>를 누르면 새 회원으로 등록하고 참석자에 넣습니다.`:'등록된 회원이 없어요. 위에 이름을 입력해 추가하세요.'}</span>`;
  $('mcount').textContent=S.members.length+'명';
  $('editBtn').textContent=editing?'삭제 끝내기':'회원 삭제';
  $('editBtn').classList.toggle('on',editing);
  $('memberHint').textContent=editing?'누르는 회원은 목록에서 지워집니다. 다 지웠으면 「삭제 끝내기」를 누르세요.'
    :'이름을 누르면 참석자로 들어가고, 다시 누르면 빠집니다. 목록에 없는 사람은 위에 입력하고 추가하세요.';
}
function render(){
  $('pcount').textContent=S.players.length+'명';
  $('chips').innerHTML=S.players.length?S.players.map(p=>`<span class="chip">${esc(p)}<button aria-label="${esc(p)} 빼기" data-rm="${esc(p)}">×</button></span>`).join('')
    :'<span class="none">아래 회원 목록에서 오늘 온 사람을 눌러 주세요.</span>';
  renderMembers();
  $('mDouble').setAttribute('aria-pressed',S.mode==='doubles');
  $('mSingle').setAttribute('aria-pressed',S.mode!=='doubles');
  $('courtsIn').value=S.courts;$('roundsIn').value=S.rounds;
  const R=$('rounds');
  if(!S.schedule.length){
    R.innerHTML=`<div class="empty">회원 목록에서 참석자를 고르고 코트 수를 정한 뒤 <b>대진표 만들기</b>를 누르세요.</div>`;
    $('statsBox').hidden=true;return;
  }
  R.innerHTML=S.schedule.map((r,i)=>`
    <section class="round${r.done?' done':''}">
      <div class="rhead"><span class="rnum">${i+1}라운드</span>
        <label class="done-toggle"><input type="checkbox" id="done${i}" data-done="${i}" ${r.done?'checked':''}> 완료</label></div>
      <div class="courts">${r.matches.map(m=>`
        <div class="court"><span class="ctag">COURT ${m.court}</span>
          <span class="team">${m.a.map(esc).join(' · ')}</span>
          <span class="vs">VS</span>
          <span class="team">${m.b.map(esc).join(' · ')}</span></div>`).join('')}</div>
      ${r.rest.length?`<div class="rest">휴식: <b>${r.rest.map(esc).join(', ')}</b></div>`:''}
    </section>`).join('');
  const H=buildHistory(S.schedule);
  const all=[...S.players,...Object.keys(H.games).filter(p=>!S.players.includes(p))];
  const max=Math.max(1,...all.map(p=>H.games[p]||0));
  $('statBody').innerHTML=all.map(p=>{const g=H.games[p]||0;return `<tr class="${S.players.includes(p)?'':'gone'}"><td>${esc(p)}</td><td class="n">${g}<span class="bar" style="width:${g/max*80}px"></span></td><td class="n">${H.rest[p]||0}</td></tr>`;}).join('');
  $('statsBox').hidden=false;
}

$('addBtn').onclick=()=>{const v=$('nameIn').value;if(v.trim()){addNames(v);$('nameIn').value='';renderMembers();$('nameIn').focus();}};
$('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('addBtn').click();}});
$('nameIn').addEventListener('input',renderMembers);
$('chips').onclick=e=>{const n=e.target.dataset.rm;if(n!==undefined)removePlayer(n);};
$('members').onclick=e=>{const n=e.target.dataset.m;if(n===undefined)return;editing?deleteMember(n):toggleMember(n);};
$('editBtn').onclick=()=>{editing=!editing;renderMembers();};
$('selAll').onclick=()=>{
  const q=$('nameIn').value.trim();
  S.members.filter(n=>!q||n.includes(q)).forEach(n=>{if(!S.players.includes(n))S.players.push(n);});
  save();render();
};
$('clearPlayers').onclick=()=>{S.players=[];save();render();};
$('mDouble').onclick=()=>{S.mode='doubles';save();render();};
$('mSingle').onclick=()=>{S.mode='singles';save();render();};
$('courtsIn').onchange=()=>{S.courts=Math.max(1,parseInt($('courtsIn').value)||1);save();};
$('roundsIn').onchange=()=>{S.rounds=Math.max(1,parseInt($('roundsIn').value)||1);save();};
$('genBtn').onclick=generate;
$('rounds').onchange=e=>{const i=e.target.dataset.done;if(i!==undefined){S.schedule[+i].done=e.target.checked;save();render();}};
let resetArm=false;
$('resetBtn').onclick=()=>{
  if(!resetArm){resetArm=true;$('resetBtn').textContent='한 번 더 누르면 초기화됩니다';setTimeout(()=>{resetArm=false;$('resetBtn').textContent='대진표 전체 초기화';},3000);return;}
  resetArm=false;S.schedule=[];$('resetBtn').textContent='대진표 전체 초기화';save();render();
};
render();
</script>
